<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stanbax Schools Ibadan</title>
    <meta name="description" content="Official portal and learning platform for Stanbax Schools Ibadan, featuring academic programs, faculty, student testimonials, and admissions." />
    <meta property="og:title" content="Stanbax Schools Ibadan" />
    <meta property="og:description" content="Official portal and learning platform for Stanbax Schools Ibadan, featuring academic programs, faculty, student testimonials, and admissions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Nunito:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        function showRecoveryUI(reason) {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0 || root.querySelector('#app-shell-preloader'))) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;text-align:center;">' +
              '<div style="width:58px;height:58px;background:#f59e0b;color:#0f172a;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;margin-bottom:16px;box-shadow:0 10px 25px -5px rgba(245,158,11,0.4);">!</div>' +
              '<h2 style="font-size:20px;font-weight:800;margin:0 0 8px 0;">Stanbax Schools Ibadan</h2>' +
              '<p style="font-size:13px;color:#94a3b8;max-width:320px;margin:0 0 20px 0;line-height:1.5;">' + (reason || 'Network connection is taking longer than expected over mobile data.') + '</p>' +
              '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">' +
                '<button onclick="window.location.reload(true)" style="background:#2563eb;color:#ffffff;border:none;padding:12px 22px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;">Reload Page</button>' +
                '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(x){}window.location.reload(true)" style="background:#334155;color:#e2e8f0;border:none;padding:12px 18px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;">Clear Cache &amp; Reload</button>' +
              '</div>' +
            '</div>';
          }
        }

        // 1. Capture script resource load errors in capture phase
        window.addEventListener('error', function(e) {
          var target = e.target || e.srcElement;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            showRecoveryUI('A script failed to download over the network. Tap below to reload.');
          }
        }, true);

        // 2. Capture unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
          console.warn('[Unhandled Rejection]', e.reason);
        });

        // 3. Progressive hint: If after 5.5s the React bundle is still downloading, provide a retry button
        setTimeout(function() {
          var retryArea = document.getElementById('preloader-retry-area');
          if (retryArea) {
            retryArea.style.display = 'block';
          }
        }, 5500);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div id="app-shell-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, #1e3a8a, #0284c7); border: 2px solid #38bdf8; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #facc15; box-shadow: 0 10px 30px -5px rgba(2,132,199,0.5); margin-bottom: 16px;">
          SBS
        </div>
        <div style="font-size: 20px; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 6px; color: #f8fafc;">
          Stanbax Schools Ibadan
        </div>
        <div style="font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 24px;">
          Continuous Assessment &amp; Learning Portal
        </div>
        <div style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 9999px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25);">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #38bdf8;"></div>
          <span style="font-size: 12px; font-weight: 700; color: #38bdf8;">Loading academic portals...</span>
        </div>

        <div id="preloader-retry-area" style="display: none; margin-top: 24px;">
          <p style="font-size: 12px; color: #64748b; margin-bottom: 10px;">Taking a moment over mobile connection?</p>
          <button onclick="window.location.reload(true)" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 8px 18px; border-radius: 9999px; font-weight: 700; font-size: 12px; cursor: pointer;">
            Tap to Refresh
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
